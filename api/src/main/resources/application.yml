server:
  port: ${API_PORT:8090}   # 8080 (Tomcat service) et 8081 (Docker) sont déjà pris sur cette machine

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:naina}
    username: ${MYSQL_USER:naina}
    password: ${MYSQL_PASSWORD:naina}
  jpa:
    hibernate:
      ddl-auto: validate        # le schéma est géré par Flyway, Hibernate vérifie seulement
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Configuration applicative
naina:
  storage-dir: ${STORAGE_DIR:./storage/songs}
  watcher-index: ${WATCHER_INDEX:./watcher-index.txt}
  repertoire-dir: ${REPERTOIRE_DIR:./repertoire}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-chars}
    expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.hibernate.SQL: warn
